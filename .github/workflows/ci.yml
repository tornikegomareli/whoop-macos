name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker:
    name: Broker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Broker/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run check
      - run: npm test

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run check
      - run: npm run build:cloudflare

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: mise exec -- tuist install
      - run: mise exec -- tuist test WhoopScope --platform macOS --no-selective-testing -- CODE_SIGNING_ALLOWED=NO
